services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_ai
    # Host ports omitted to avoid conflicts; services talk on the compose network.
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - studio_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio_ai
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      JWT_SECRET: studio-ai-dev-secret-change-me
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080
      MUSIC_COST_CREDITS: "10"
      BOOTSTRAP_ADMIN_EMAIL: admin@studio.ai
      BOOTSTRAP_ADMIN_PASSWORD: studio123
      BOOTSTRAP_ADMIN_NAME: 林制作人
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
      - studio_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio_ai
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      JWT_SECRET: studio-ai-dev-secret-change-me
      MUSIC_COST_CREDITS: "10"
    volumes:
      - ./backend:/app
      - studio_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  studio_pg:
  studio_redis:
  studio_data:
